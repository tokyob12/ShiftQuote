[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "./apps/web/src" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
